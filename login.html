<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Karindo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="container">

    <div class="left-side">
      <h1>Selamat Datang</h1>
      <p>
        Temukan lowongan pekerjaan dan pelatihan terbaik untuk masa depanmu bersama Karindo.
      </p>

      <div class="features">
        <div class="feature-card">
          <h3>💼 Lowongan Kerja</h3>
          <p>Cari pekerjaan sesuai skill dan minatmu.</p>
        </div>

        <div class="feature-card">
          <h3>📚 Pelatihan</h3>
          <p>Ikuti pelatihan untuk meningkatkan kemampuan.</p>
        </div>
      </div>
    </div>

    <div class="right-side">

      <div class="form-box">

        <div class="form-header">
          <button class="tab-btn active" id="loginBtn">Masuk</button>
          <button class="tab-btn" id="registerBtn">Daftar</button>
        </div>

        <!-- LOGIN -->
        <form id="loginForm" class="form active-form">

          <h2>Login Akun</h2>

          <input type="email" placeholder="Email" required>

          <input type="password" placeholder="Password" required>

          <button type="submit" class="main-btn">
            Masuk
          </button>

          <p class="bottom-text">
            Belum punya akun?
            <span id="goRegister">Daftar</span>
          </p>

        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="form">

          <h2>Buat Akun</h2>

          <input type="text" placeholder="Nama Lengkap" required>

          <input type="email" placeholder="Email" required>

          <input type="password" placeholder="Password" required>

          <button type="submit" class="main-btn">
            Daftar
          </button>

          <p class="bottom-text">
            Sudah punya akun?
            <span id="goLogin">Masuk</span>
          </p>

        </form>

      </div>

    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
