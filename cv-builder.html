<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat CV</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="cv-container">

<h1>Buat Curriculum Vitae</h1>

<div class="cv-layout">

<div class="cv-form">

<input type="text" id="nama" placeholder="Nama Lengkap">

<input type="text" id="email" placeholder="Email">

<input type="text" id="telepon" placeholder="Nomor HP">

<textarea id="deskripsi"
placeholder="Deskripsi Diri"></textarea>

<input type="text" id="pendidikan"
placeholder="Riwayat Pendidikan">

<input type="text" id="organisasi"
placeholder="Pengalaman Organisasi">

<input type="text" id="skill"
placeholder="Skill (pisahkan dengan koma)">

</div>

<div class="cv-preview">

<h1 id="cvNama">Nama Lengkap</h1>

<p id="cvEmail">Email</p>

<p id="cvTelepon">Nomor HP</p>

<h3>Tentang Saya</h3>

<p id="cvDeskripsi"></p>

<h3>Pendidikan</h3>

<p id="cvPendidikan"></p>

<h3>Organisasi</h3>

<p id="cvOrganisasi"></p>

<h3>Skill</h3>

<ul id="cvSkill"></ul>

</div>

</div>

</section>

<script src="js/cv.js"></script>

</body>
</html>
